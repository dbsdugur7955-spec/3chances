  function hideAll() { show($('early'), false); show(dlg, false); show(tapHint, false); show(pick, false); ov.className = 'fs hide'; ov.textContent = ''; clearTimeout(docTimer); stage.classList.remove('shake'); }
  function setHud() {

  function next() {

  function say(s) {

    txt.textContent = ''; typing = true;

    var spd = s.spd || (s.who ? 34 : 44), wait = [];

      fullText += ch;
      wait.push(spd + (/[.?!…]/.test(ch) ? Math.max(170, spd * 3) : ch === ',' ? 120 : 0));
    });
    (function tick() {
      typeTimer = setTimeout(function () {

        tick();

    })();
    if (P.ch && s.who === CH[P.ch].name) {
      var shapes = [1, 2, 1, 0, 2, 1, 2, 0], k = Math.floor(Math.random() * shapes.length);
      talkTimer = setInterval(function () {

  function jolt(ms) {                                // the whole screen jumps

  function finishTyping() {

    if (P.mouth) { P.mouth = 0; draw(); }
  }
  function doc(s) {
    show(ov, true); ov.className = 'fs doc' + (/^(prop|calling|lock|drawer|stick|memo|notice|ledger|receipt|card)$/.test(s.id) ? ' prop' : '');
    docBusy = false; clearTimeout(docTimer); docDone = function () {};
    docs[s.id](s.opt).forEach(function (n) { ov.appendChild(n); });
    var sub = el('div', 'sub fs-s blink', s.id === 'drawer' ? '화면을 눌러 꺼내기' : '화면을 눌러 닫기'); ov.appendChild(sub);
    if (docBusy) { show(sub, false); docDone = function () { docBusy = false; show(sub, true); }; }
  }
  function act(s) {
    show(pick, true); pick.className = 'act'; pick.textContent = '';
    var b = el('button', 'opt', s.label); onPress(b, next); pick.appendChild(b);
  }
  function choose(s) {
    show(pick, true); pick.className = 'act'; pick.textContent = '';
    s.opts.forEach(function (o) {
      var b = el('button', 'opt', o.label); onPress(b, function () { queue = o.go().concat(queue); next(); }); pick.appendChild(b);
    });
  }
  function ledgerBtn(back) {
    var lb = el('button', 'ledger', '대장 보기');
    onPress(lb, function () { queue = [{ t: 'doc', id: 'ledger' }, back].concat(queue); next(); });
    return lb;
  }
  function ask(set) {
    curAsk = set;
    var st = ASK[set];
    if (st.left <= 0) { queue = afterAsk(set).concat(queue); return next(); }
    setHud(); show(pick, true); pick.className = ''; pick.textContent = '';
    var early = $('early'); early.textContent = ''; show(early, true);
    [['give', '내준다'], ['refuse', '거절한다']].forEach(function (o) {
      var eb = el('button', o[0], o[1]);
      onPress(eb, function () { queue = outcome(set, o[0]).concat(queue); next(); });
      early.appendChild(eb);
    });
    var top = el('div', 'top fs-s');
    var cnt = el('span'); cnt.appendChild(document.createTextNode('물을 수 있는 건 ')); cnt.appendChild(el('b', null, st.left + '번')); top.appendChild(cnt);
    top.appendChild(ledgerBtn({ t: 'ask', set: set })); pick.appendChild(top);

  }
  var WORD = { give: '내줬다', refuse: '거절했다', hold: '보류했다' };
  function known() {                                 // [condition, line] in order; lines that were not earned are simply absent
    var sj = ASK.seojin.asked, mj = ASK.minjae.asked;
    function has(a, i) { return a.indexOf(i) >= 0; }
    return [
      [F.PHONE === '센터', '휴대폰은 서랍에 있다. ‘경찰 인계 대기’.'],
      [F.PHONE === '언니', '휴대폰은 언니가 경찰서로 가져갔다.'],
      [F.PHONE === '민재', '휴대폰은 강민재가 가져갔다.'],
      [true, '휴대폰의 주인은 윤서진의 동생이다. 화요일 밤부터 연락이 없다.'],
      [has(sj, 0), '휴대폰 신호는 화요일 밤 이 역에서 멈췄다.'],
      [has(sj, 1), '동생은 휴대폰을 두고 다니지 않는다.'],
      [has(sj, 2), '동생은 누가 자꾸 집 앞에 서 있다고 했다.'],
      [!!F.PEEK, '화요일 23:47, 보내지 못한 메시지가 있었다.'],
      [true, '계단참에 젊은 남자가 서 있었다.'],
      [has(mj, 0), '강민재는 잠금 번호를 알았다. 0412.'],
      [!!F.ASK_WHERE, '강민재는 “7-4 쪽 벤치”라고 말했다. 대장에만 적힌 장소다.'],
      [has(mj, 2), '강민재는 그녀가 아파서 못 온다고 했다.'],
      [!!F.ASK_CALL, '강민재가 보여준 문자는 오늘 오후 2:10에 왔다. 휴대폰은 수요일부터 서랍에 있었다.'],
      [has(mj, 4), '강민재는 언니가 다녀간 것을 알았다.'],

  var endTimers = [], endDone = true, endFinish = function () {};
  function end() {
